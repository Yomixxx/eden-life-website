  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.2s) ──────────────────────────────────────────────
      // The backdrop is mid-motion, not held from frame one: a brief
      // continued camera push settles by 1.2s — this frame's ONE exception
      // to "always moving," resolved fast (was a multi-second stall before).
      tl.fromTo(
        '.f10-bg-img',
        { scale: 1.0 },
        { scale: 1.045, duration: 1.2, ease: 'power2.out' },
        0
      );

      // The mark and its glow bloom in together as ONE beat (glow behind,
      // hero in front) — hero fully visible well inside the 0.5s floor.
      tl.fromTo(
        '.f10-mark-wrap',
        { scale: 0.84, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.5)' },
        0
      );

      tl.fromTo(
        '.f10-glow',
        { scale: 0.82, opacity: 0 },
        { scale: 1, opacity: 0.32, duration: 0.5, ease: 'power2.out' },
        0
      );

      // Near-imperceptible continuous life on the whole lockup through the
      // build + reveal window, so the shot never goes fully inert before
      // Scene 3's deliberate settle. `.f10-lockup` centers via left/margin
      // (no static CSS transform), so this scale tween owns `transform`
      // cleanly with no centering conflict.
      tl.fromTo(
        '.f10-lockup',
        { scale: 1.0 },
        { scale: 1.016, duration: 3.285 - 0.5, ease: 'none' },
        0.5
      );

      // ── Scene 2 (1.2–3.285s) — the VO ends here ─────────────────────────
      // As the VO says "plan your visit," the pink-deep underline sweeps in

      tl.fromTo(
        '.f10-underline',
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: 'power2.out' },
        1.3

      // The thin "edenlifeng.org" tagline fades in beneath the lockup,

      tl.fromTo(
        '.f10-tagline',
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' },

      );

      // ── Scene 3 (3.285–4.0s, 0.7s) — the video's ONE deliberate hold ────

        phase,

          p: Math.PI,
          duration: 4.0 - 3.285,
          ease: 'sine.inOut',
