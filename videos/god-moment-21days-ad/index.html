<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10.454"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-day-three"
        class="scene"
        data-composition-id="01-day-three"
        data-composition-src="compositions/frames/01-day-three.html"
        data-start="0"
        data-duration="2.171"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-day-three-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="1.771"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-still-happening"
        class="scene"
        data-composition-id="02-still-happening"
        data-composition-src="compositions/frames/02-still-happening.html"
        data-start="1.771"
        data-duration="5.748"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-still-happening-voice"
        src="assets/voice/02.wav"
        data-start="1.771"
        data-duration="5.248"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-still-time"
        class="scene"
        data-composition-id="03-still-time"
        data-composition-src="compositions/frames/03-still-time.html"
        data-start="7.019"
        data-duration="3.435"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-still-time-voice"
        src="assets/voice/03.wav"
        data-start="7.019"
        data-duration="3.435"
        data-track-index="10"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-day-three", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 1.771);
        tl.fromTo("#el-02-still-happening", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 1.771);
        tl.to("#el-02-still-happening", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.019);
        tl.fromTo("#el-03-still-time", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7.019);
        tl.to({}, { duration: 10.454 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
