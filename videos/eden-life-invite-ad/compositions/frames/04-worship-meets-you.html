<template data-composition-id="04-worship-meets-you">
  <style>
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Poppins", sans-serif;
    }

    .f04wmy-ground {
      position: absolute;
      inset: 0;
      background: #080f0e;
    }

    .f04wmy-camera {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .f04wmy-stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .f04wmy-img {
      position: absolute;
      top: -70px;
      left: -180px;
      width: calc(100% + 360px);
      height: calc(100% + 140px);
      will-change: transform, opacity;
    }

    .f04wmy-img img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .f04wmy-dim {
      position: absolute;
      inset: 0;
      background: #000;
    }

    .f04wmy-caption {
      position: absolute;
      top: 758px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 5cqw;
      will-change: transform, opacity;
    }

    .f04wmy-caption span {
      font-family: "Montserrat", sans-serif;
      font-weight: 500;
      font-size: 2.6cqw;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-align: center;
    }
  </style>

  <div id="root">
    <div
      class="clip f04wmy-ground"
      data-start="0"
      data-duration="2.603"
      data-track-index="0"
    ></div>

    <div class="f04wmy-camera" id="f04wmy-camera">
      <div class="f04wmy-stage">
        <div
          class="clip f04wmy-img f04wmy-img-joy"
          id="f04wmy-img-joy"
          data-start="0"
          data-duration="2.17"
          data-track-index="1"
        >
          <img src="assets/worship-joy.jpg" alt="" />
        </div>

        <div
          class="clip f04wmy-img f04wmy-img-singer"
          id="f04wmy-img-singer"
          data-start="2.17"
          data-duration="0.433"
          data-track-index="2"
        >
          <img src="assets/worship-singer.jpg" alt="" />
        </div>

        <div
          class="clip f04wmy-dim f04wmy-dim-joy"
          data-start="0"
          data-duration="2.17"
          data-track-index="3"
          style="opacity: 0.15"
        ></div>

        <div
          class="clip f04wmy-dim f04wmy-dim-singer"
          data-start="2.17"
          data-duration="0.433"
          data-track-index="3"
          style="opacity: 0.32"
        ></div>

        <div
          class="clip f04wmy-caption"
          id="f04wmy-caption"
          data-start="2.2"
          data-duration="0.403"
          data-track-index="4"
        >
          <span>Right where you are.</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const TOTAL_DURATION = 2.603;
      const CUT_AT = 2.17;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const camera = document.getElementById("f04wmy-camera");
      const imgJoy = document.getElementById("f04wmy-img-joy");
      const imgSinger = document.getElementById("f04wmy-img-singer");
      const caption = document.getElementById("f04wmy-caption");

      gsap.set(imgSinger, { x: -140, opacity: 0.35 });
      gsap.set(caption, { opacity: 0, y: 16 });

      // --- Multi-phase camera: phase scale + continuous drift, one writer ---
      const phase = { scale: 1.0 }; // Phase 1 — initial value, no tween

      // Phase 2 — push begins as the VO opens ("Worship that meets you")
      tl.to(phase, { scale: 1.05, duration: 0.9, ease: "power2.out" }, 0);

      // Phase 3 — push deepens, eases to a stop inside Scene 2's window
      tl.to(phase, { scale: 1.09, duration: 0.85, ease: "power3.out" }, 0.9);

      // Drift driver — continuous sine micro-motion spanning the whole shot.
      const drift = { p: 0 };
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1,
          duration: TOTAL_DURATION,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 4;
            const dy = Math.sin(drift.p * 1.3) * 2;
            camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
          },
        },
        0,
      );

      // --- Scene 3 seam: cut-the-curve, rightward, velocity-matched ---
      // Exit: worship-joy accelerates rightward into the cut.
      tl.to(imgJoy, { x: 140, duration: 0.24, ease: "power4.in" }, CUT_AT - 0.24);
      tl.to(imgJoy, { opacity: 0, duration: 0.2, ease: "power1.in" }, CUT_AT - 0.24);

      // Entry: worship-singer continues the same rightward motion, decelerating.
      tl.to(
        imgSinger,
        { x: 0, opacity: 1, duration: 0.4, ease: "power4.out" },
        CUT_AT,
      );

      // Closing caption — fades in low-third after the cut, holds to the end.
      tl.to(
        caption,
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        2.25,
      );

      window.__timelines["04-worship-meets-you"] = tl;
    })();
  </script>
</template>
